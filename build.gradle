plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.111'
}

version = '1.0.3'
group = 'com.oritong.cloudstorage'
base.archivesName = 'cloudstorage_reborn'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir 'src/gametest/java'
// Compile the optional interface separately; Mouse Tweaks supplies it at runtime.
sourceSets {
    mouseTweaksApi { compileClasspath = sourceSets.main.compileClasspath }
    main { compileClasspath += sourceSets.mouseTweaksApi.output }
}

neoForge {
    version = project.findProperty('neoForgeVersion') ?: '21.1.203'
    runs {
        client {
            client()
            if (project.hasProperty('ioSmokeTest')) {
                systemProperty 'cloudstorage_reborn.ioSmokeTest', 'true'
            }
            if (project.hasProperty('craftingSmokeTest')) {
                systemProperty 'cloudstorage_reborn.craftingSmokeTest', 'true'
            }
            if (project.hasProperty('beyondDimensionsSmokeTest')) {
                systemProperty 'cloudstorage_reborn.beyondDimensionsSmokeTest', 'true'
            }
            if (project.hasProperty('clientSmokeTest')) {
                systemProperty 'cloudstorage_reborn.clientSmokeTest', 'true'
            }
            if (project.hasProperty('fluidSmokeTest')) {
                systemProperty 'cloudstorage_reborn.fluidSmokeTest', 'true'
            }
            if (project.hasProperty('tankSmokeTest')) {
                systemProperty 'cloudstorage_reborn.fluidSmokeTest', 'true'
                systemProperty 'cloudstorage_reborn.tankSmokeTest', 'true'
            }
            if (project.hasProperty('mouseTweaksSmokeTest')) {
                systemProperty 'cloudstorage_reborn.fluidSmokeTest', 'true'
                systemProperty 'cloudstorage_reborn.mouseTweaksSmokeTest', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cloudstorage_reborn'
        }
    }
    mods {
        cloudstorage_reborn { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation files('libs/citadel-2.7.1-1.21.1.jar')
    // Optional local runtime JAR for integration checks; never bundled or required to build.
    if (project.hasProperty('beyondDimensionsTestJar')) {
        runtimeOnly files(project.property('beyondDimensionsTestJar'))
    }
    if (project.hasProperty('mouseTweaksTestJar')) {
        runtimeOnly files(project.property('mouseTweaksTestJar'))
    }
    if (project.hasProperty('mekanismTestJar')) {
        runtimeOnly files(project.property('mekanismTestJar'))
    }
    if (project.hasProperty('modernIndustrializationTestMods')) {
        runtimeOnly fileTree(dir: project.property('modernIndustrializationTestMods'),
                includes: ['*Modern-Industrialization*.jar', 'guideme-*.jar', '*GrandPower*.jar'])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    from('LICENSE')
    archiveFileName = "${base.archivesName.get()}-${project.version}-1.21.1-neoforge.jar"
    includeEmptyDirs = false
    exclude 'data/alexsmobs/**'
    exclude 'com/oritong/cloudstorage/tests/**'
    exclude 'data/cloudstorage_reborn/structure/empty.nbt'
    manifest.attributes('Implementation-Version': project.version)
}
