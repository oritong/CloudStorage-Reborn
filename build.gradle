plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.111'
}

version = '1.0.0'
group = 'com.oritong.cloudstorage'
base.archivesName = 'cloudstorage_reborn'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir 'src/gametest/java'

neoForge {
    version = '21.1.203'
    runs {
        client {
            client()
            if (project.hasProperty('clientSmokeTest')) {
                systemProperty 'cloudstorage_reborn.clientSmokeTest', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cloudstorage_reborn'
        }
    }
    mods {
        cloudstorage_reborn { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation files('libs/citadel-2.7.1-1.21.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
tasks.named('processResources', ProcessResources) {
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
jar {
    from('LICENSE')
    archiveFileName = "${base.archivesName.get()}-${project.version}-1.21.1-neoforge.jar"
    includeEmptyDirs = false
    exclude 'data/alexsmobs/**'
    exclude 'com/oritong/cloudstorage/tests/**'
    exclude 'data/cloudstorage_reborn/structure/empty.nbt'
    manifest.attributes('Implementation-Version': project.version)
}
